# SonarCloud Configuration
sonar.projectKey=DavidMRB_cypress-realworld-app
sonar.organization=DavidMRB

# Metadata
sonar.projectName=Cypress RealWorld App
sonar.projectVersion=1.0

# Source code
sonar.sources=src
sonar.tests=cypress,src

# Exclusions
sonar.exclusions=*/node_modules/,/dist/,/build/,/.spec.ts,*/.test.ts
sonar.test.exclusions=*/node_modules/*

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=*/.spec.ts,*/.test.ts,*/.config.js,*/cypress/*

# Code analysis
sonar.sourceEncoding=UTF-8