name: CI Pipeline

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del código
      - uses: actions/checkout@v4

      # 2️⃣ Configurar Node y cachear dependencias Yarn
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      # 3️⃣ Instalar dependencias con Yarn (sin modificar lockfile)
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 4️⃣ Ejecutar pruebas unitarias
      - name: Run unit tests
        run: yarn test:unit

      # 5️⃣ Ejecutar pruebas de Cypress (sin Cypress Cloud)
      - name: Run Cypress tests
        uses: cypress-io/github-action@8b598e8d51c9ef67b1829b6e4d324e21e94ab99f
        with:
          start: yarn start:ci
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
          browser: chrome
          command: yarn cypress:run  # ⬅️ ejecuta el script correcto
          record: false
          parallel: false
          config-file: cypress.config.ts

      # 6️⃣ Subir screenshots si las pruebas fallan
      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      # 7️⃣ Escaneo de SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@4b6234a8c3ed2e5b3fa3b8b39b27ef884bc385c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
