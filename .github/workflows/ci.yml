name: CI Pipeline

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del código
      - uses: actions/checkout@v4

      # 2️⃣ Configurar Node y cachear dependencias Yarn
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      # 3️⃣ Instalar dependencias con Yarn (sin modificar lockfile)
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 4️⃣ Ejecutar pruebas unitarias
      - name: Run unit tests
        run: yarn test:unit

      # 5️⃣ Ejecutar pruebas de Cypress (sin Cypress Cloud)
      - name: Run Cypress tests
        uses: cypress-io/github-action@53299cbe789c64daab823c4bfb1882d05e9feaf3
        env:
          PORT: 3000
          API_PORT: 3001
          NODE_ENV: test
        with:
          start: yarn dev
          wait-on: "http://localhost:3000"
          wait-on-timeout: 180
          browser: chrome
          command: yarn cypress:run  # ⬅️ ejecuta el script correcto
          record: false
          parallel: false
          config-file: cypress.config.ts

      # 6️⃣ Subir screenshots si las pruebas fallan
      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      # 7️⃣ Escaneo de SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
